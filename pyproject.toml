[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boe-mcp"
version = "0.1.0"
description = "MCP server for Spain's Boletín Oficial del Estado (BOE) open-data API: daily gazette summaries, consolidated legislation search and retrieval, and reference lookups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BoeMCP contributors" }]
keywords = ["mcp", "boe", "legislation", "spain", "government", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "mcp>=1.25,<2",
    "httpx>=0.27",
    "lxml>=5,<7",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/QuantumBBoy/boe-mcp"
"Data source" = "https://www.boe.es/datosabiertos/"

[project.scripts]
boe-mcp = "boe_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boe_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
